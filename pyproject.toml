[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "imageparser"
version = "2.1.0"
description = "Screenshot image parsing with OCR-based fare extraction."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
keywords = [
    "image-parsing", "ocr", "easyocr", "fare-analysis", "data-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pandas>=1.5",
    "PyYAML>=6.0",
    "opencv-python>=4.7",
    "numpy>=1.23",
]

[project.optional-dependencies]
easyocr = ["easyocr>=1.7"]
paddle = ["paddleocr>=2.7"]
tesseract = ["pytesseract>=0.3.10"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/OZinOZ/AndroidAppAutomation"
Repository = "https://github.com/OZinOZ/AndroidAppAutomation"
Issues = "https://github.com/OZinOZ/AndroidAppAutomation/issues"
Changelog = "https://github.com/OZinOZ/AndroidAppAutomation/blob/main/CHANGELOG.md"

[project.scripts]
imageparser = "imageparser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["imageparser"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py39"
