# Default configuration; copy to `config.yaml` and edit for a local override.

# Root folder for routes/, screenshots/ and logs/ (absolute or relative path).
work_base: .

# Legacy device-capture setting; retained for configuration compatibility.
adb_path: adb
# adb_path: C:\platform-tools\adb.exe

# Set this only when Tesseract is not available on PATH.
# tesseract_cmd: C:\Program Files\Tesseract-OCR\tesseract.exe

# OCR engine for the analysis step: auto | easyocr | paddleocr | tesseract
ocr_engine: tesseract
ocr_gpu: false

# Existing aliases and screen profiles. Aliases are passed to --phone.
# Screen profiles live in imageparser/constants.py. Serials are retained for
# configuration compatibility and are not used by image analysis.
phones:
  optus:
    serial: unused
    profile: hd720
  phone_a:
    serial: YOUR_ADB_SERIAL_A
    profile: hd720
  phone_b:
    serial: YOUR_ADB_SERIAL_B
    profile: hd720

# Legacy capture setting; retained for configuration compatibility.
partial_routes: [1, 2, 3]

# Legacy notification settings; retained for configuration compatibility.
email:
  sender: your.sender@example.com
  recipient: your.recipient@example.com
  credentials_file: credentials.json
  token_file: token.json
